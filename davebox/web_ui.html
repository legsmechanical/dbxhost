<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dAVEBOx — Clip Editor</title>
<style>
  :root{--bg:#101216;--panel:#171a20;--panel2:#1c2027;--ink:#e9ebf0;--dim:#878d9a;--faint:#5a606c;
        --accent:#39d0c8;--accent-dim:#1f5e5a;--grid:#2a2e37;--bar:#39414f;--row:#21252e;
        --rowblk:#191c22;--play:#ffcf4d;--has:#36506b;--line:#252a33;--ctl:#22262f;--ctl-br:#333a45;
        --rad:7px;--rad-sm:5px;}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  /* ---------- header ---------- */
  #top{display:flex;gap:10px;align-items:center;padding:0 12px;height:46px;background:var(--panel);
       border-bottom:1px solid #000;flex:0 0 auto}
  #top .brand{font-weight:700;letter-spacing:.5px;font-size:14px}
  #top .brand .dot{color:inherit}   /* the x matches the rest of the wordmark */
  .badge{padding:3px 10px;border-radius:20px;background:#0b0d11;color:var(--dim);font-size:12px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .badge.play{color:var(--play)}
  .badge.clip{color:var(--ink);border:1px solid var(--line);background:transparent;font:12px ui-monospace,monospace}
  .badge.warn{color:#ffcf4d;border:1px solid #6a5320;background:#241d09}
  .spacer{flex:1}
  label{color:var(--dim);font-size:12px;display:flex;gap:5px;align-items:center}
  select,button,input[type=number],input[type=text]{background:var(--ctl);color:var(--ink);
    border:1px solid var(--ctl-br);border-radius:var(--rad-sm);padding:5px 8px;cursor:pointer;font-size:12px;
    font-family:inherit}
  input[type=number]{cursor:text}
  button{transition:border-color .12s,color .12s,background .12s}
  button:hover{border-color:#48515f}
  button.on{border-color:var(--accent);color:var(--accent);background:#13312f}
  button.sm{padding:3px 8px;font-size:11px}
  button.danger{border-color:#5e2a2a;color:#e88}
  button.danger:hover{border-color:#8a3a3a}
  button.ghost{background:transparent;border-color:transparent;color:var(--dim);padding:5px 8px}
  button.ghost:hover{color:var(--ink);background:#21262f}
  #xport{color:var(--accent);font-size:13px;line-height:1;min-width:26px}
  #xport.play{color:var(--play)}
  button svg{display:block;pointer-events:none;width:16px;height:16px}
  button.ghost svg{width:18px;height:18px}
  .seg.tools button{padding:5px 10px}
  .seg{display:inline-flex;border:1px solid var(--ctl-br);border-radius:var(--rad-sm);overflow:hidden}
  .seg button{border:0;border-radius:0;padding:4px 8px}
  .seg button+button{border-left:1px solid var(--ctl-br)}
  .toolset{display:flex;gap:4px;align-items:center;color:var(--dim);font-size:12px}
  .seg.tools button{font-size:15px;min-width:32px;padding:4px 9px}
  /* ---------- session grid (tracks = columns, scenes = rows) ---------- */
  #session{flex:0 0 auto;max-height:30vh;overflow:auto;background:var(--panel);
           border-bottom:1px solid #000;padding:7px 10px}
  #session.collapsed{display:none}
  #grid{display:grid;gap:3px;align-items:stretch}
  .strk{position:relative;font:11px ui-monospace,monospace;font-weight:700;color:#0b0d11;text-align:center;
        padding:4px 17px 4px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .strk.sel{outline:2px solid var(--ink);outline-offset:-1px}
  .strk.eff{opacity:.42}                 /* effectively silenced (muted, or solo elsewhere) */
  .strk .cind{font-weight:800;margin-left:2px}
  .strk .cind.cond{color:#0b0d11}
  .strk .cind.resp{color:#0b0d11;opacity:.65}
  .strk .cind.tm{color:#7a0d0d}          /* muted "M" badge */
  .strk .cind.ts{color:#0a5d12}          /* soloed "S" badge */
  .strk-gear{position:absolute;right:1px;top:50%;transform:translateY(-50%);font-size:14px;line-height:1;
             opacity:.6;cursor:pointer;padding:3px 4px;color:#0b0d11}
  .strk-gear:hover,.strk-gear:active{opacity:1}
  /* per-track settings dropdown (route / MIDI channel) */
  .trkgear{position:fixed;width:188px;background:var(--panel2);border:1px solid var(--ctl-br);
    border-radius:var(--rad);box-shadow:0 12px 32px rgba(0,0,0,.55);padding:10px 12px;z-index:40}
  .trkgear h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .trkgear .tgrow{margin:8px 0}
  .trkgear .tgrow span{display:block;font-size:11px;color:var(--dim);margin-bottom:3px}
  .scorner{font:10px ui-monospace,monospace;color:var(--faint);display:flex;align-items:center;justify-content:center}
  .slaunch{font:10px ui-monospace,monospace;color:var(--dim);background:#0b0d11;border:1px solid #262c36;
           border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;padding:2px}
  .slaunch:hover{color:var(--ink);border-color:var(--accent)}
  .sclip{height:17px;border-radius:3px;cursor:pointer;position:relative;background:var(--row);
         border:1px solid transparent}
  .sclip.sel{outline:2px solid var(--ink);outline-offset:-1px;z-index:2}
  .sclip.playing{box-shadow:inset 0 0 0 2px var(--play)}
  .sclip.queued{border-style:dashed;border-color:var(--play)}
  .sclip[draggable=true]{cursor:pointer}
  .sclip.drop{outline:2px dashed var(--accent);outline-offset:-1px;z-index:3}
  .sclip.cutmark{opacity:.55;outline:1px dashed var(--dim);outline-offset:-1px}
  .sclip-menu{position:absolute;right:0;top:50%;transform:translateY(-50%);
    font-size:11px;line-height:1;padding:2px 6px;color:#000;opacity:0;
    cursor:pointer;user-select:none;border-radius:2px;text-align:center}
  .sclip:hover .sclip-menu{opacity:1}
  .sclip-menu:hover{background:rgba(255,255,255,.25)}
  .clipmenu{position:fixed;min-width:130px;background:var(--panel2);border:1px solid var(--ctl-br);
    border-radius:6px;padding:4px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  .clipmenu button{display:block;width:100%;text-align:left;background:transparent;border:0;
    color:var(--ink);font:12px system-ui;padding:5px 8px;border-radius:4px;cursor:pointer}
  .clipmenu button:hover:not(:disabled){background:var(--ctl)}
  .clipmenu button:disabled{color:var(--dim);cursor:default;opacity:.5}
  /* ---------- main split ---------- */
  #main{flex:1;display:flex;min-height:0}
  #rollwrap{flex:1;display:flex;flex-direction:column;min-width:0}
  #rollview{flex:1;position:relative;overflow:hidden;background:var(--bg);touch-action:none}
  #rollcanvas{display:block;position:absolute;left:0;top:0;touch-action:none}
  /* smooth playhead: a thin DOM line over the roll, glided via rAF.
     top MUST equal the JS RULER constant (24+ZB) and bottom the STEPBAND. */
  #playhead{position:absolute;left:0;top:42px;bottom:28px;width:2px;margin-left:-1px;
    background:var(--play);box-shadow:0 0 3px rgba(255,207,77,.5);pointer-events:none;
    display:none;will-change:transform}
  /* continuous edge zoom strips — drag bars in the RESERVED empty bands at the top
     of the ruler + left of the gutter (the JS reserves a ZB=18px band there: ruler
     content / loop brace shifted down by ZB, pitch labels shifted right by ZB), so
     the strips never cover the brace, pitch labels, or notes. Top strip: vertical
     drag = horizontal zoom (down=in, up=out). Left strip: horizontal drag = vertical
     zoom (right=in, left=out). zh: top 0, left=GUTTER(66), height=ZB(18) — spans the
     note-area width above the ruler content. zv: left 0, top=RULER(42),
     bottom=STEPBAND(28), width=ZB(18) — left of the gutter, spanning the note rows. */
  .zoomstrip{position:absolute;z-index:7;touch-action:none;user-select:none;
    display:flex;align-items:center;justify-content:center;gap:5px;
    background-color:rgba(57,208,200,.16);box-shadow:inset 0 0 0 1px rgba(57,208,200,.34);
    color:rgba(150,238,230,.92);font-size:8px;font-weight:700;letter-spacing:1px;
    transition:background-color .12s}
  .zoomstrip:hover,.zoomstrip:active{background-color:rgba(57,208,200,.34)}
  .zoomstrip.zh{top:0;left:66px;right:0;height:18px;cursor:ns-resize}   /* left = GUTTER (48+ZB) */
  .zoomstrip.zv{top:42px;bottom:28px;left:0;width:18px;cursor:ew-resize;flex-direction:column}   /* top = RULER (24+ZB) */
  /* docked context editor (selected note / step) */
  #editbar{flex:0 0 auto;border-top:2px solid var(--accent-dim);background:var(--panel2);padding:10px 14px;
           display:flex;gap:10px 24px;align-items:center;flex-wrap:wrap;min-height:50px;row-gap:8px}
  .ebgrp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ebgrp .et{font:13px ui-monospace,monospace;font-weight:700;color:var(--accent);letter-spacing:.4px;
    padding:3px 9px;background:#13312f;border-radius:5px}
  .ebgrp label{color:var(--dim);font-size:12.5px;gap:5px}
  .ebgrp input[type=number]{width:64px;text-align:right;padding:7px 9px;font-size:13px}
  .ebgrp button.sm{padding:6px 11px;font-size:13px}
  .ebgrp select{font-size:12.5px;padding:6px 8px}
  .eb-empty{color:var(--faint);font-size:12.5px;font-style:italic}
  #velwrap{flex:0 0 74px;border-top:1px solid #000;background:#0e1014;position:relative;overflow:hidden;touch-action:none}
  .lane-rs{position:absolute;left:0;right:0;top:0;height:6px;cursor:ns-resize;z-index:5;touch-action:none}
  .lane-rs:hover,.lane-rs.on{background:rgba(57,208,200,0.25)}
  #lanetip{position:fixed;pointer-events:none;background:rgba(6,8,12,0.92);color:var(--ink);
    font:11px ui-monospace,monospace;padding:2px 6px;border-radius:3px;z-index:70;display:none;
    border:1px solid var(--ctl-br)}
  #velcanvas{display:block;position:absolute;left:0;top:0;cursor:ns-resize;touch-action:none}
  #vellabel{position:absolute;left:6px;top:3px;font:10px ui-monospace,monospace;color:var(--faint);pointer-events:none}
  #drumph{position:absolute;inset:0;display:none;flex-direction:column;gap:6px;
    align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:20px;font-size:14px}
  #drumph b{color:var(--ink)}
  /* ---------- stacked band headers (velocity / automation) ---------- */
  .bandhdr{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:0 10px;height:21px;
    background:var(--panel);border-top:1px solid #000;cursor:pointer;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.6px;color:var(--dim);user-select:none}
  .bandhdr:hover{color:var(--ink);background:#1b1f26}
  .bandhdr .tw{font-size:9px;color:var(--faint);width:9px;display:inline-block}
  .bandhdr .bl{font-weight:600}
  .bandhdr .bsum{margin-left:auto;color:var(--faint);font:11px ui-monospace,monospace;
    text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
  #autowrap{flex:0 0 72px;border-top:1px solid #000;background:#0e1014;position:relative;overflow:hidden;touch-action:none}
  #autocanvas{display:block;position:absolute;left:0;top:0;touch-action:none;cursor:crosshair}
  #autopick{flex:0 0 auto;display:flex;gap:4px;padding:4px 6px 4px 8px;background:#0e1014;
    border-top:1px solid #000;overflow-x:auto}
  .ccslot{flex:0 0 auto;display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:var(--rad-sm);
    background:var(--ctl);border:1px solid var(--ctl-br);color:var(--dim);font-size:11px;cursor:pointer;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .ccslot:hover{border-color:#48515f;color:var(--ink)}
  .ccslot.sel{border-color:var(--accent);color:var(--accent);background:#13312f}
  .ccslot.off{opacity:.5}
  .ccslot .ccdot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .ccslot .ccv{color:var(--faint);font-size:10px}
  #autoctl{display:none;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:5px 8px;
    background:#0e1014;border-top:1px solid #000}
  #autoctl label{font-size:11.5px}
  #autoctl .cclab{font:11px ui-monospace,monospace;color:var(--accent);font-weight:700}
  #autoctl input,#autoctl select{padding:4px 6px;font-size:11.5px}
  /* ---------- inspector (accordion) ---------- */
  #side{flex:0 0 296px;background:var(--panel);border-left:1px solid #000;overflow:auto;padding:0}
  .sec{border-bottom:1px solid var(--line)}
  .sec-h{display:flex;align-items:center;gap:7px;padding:9px 12px;cursor:pointer;
    font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);user-select:none}
  .sec-h:hover{color:var(--ink);background:#1b1f26}
  .sec-h .tw{font-size:9px;color:var(--faint);width:9px;transition:transform .12s;display:inline-block}
  .sec.open .sec-h .tw{transform:rotate(90deg)}
  .sec-h .title{font-weight:600}
  .sec-h .sum{margin-left:auto;color:var(--faint);font:11px ui-monospace,monospace;text-transform:none;
    letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .sec.open .sec-h .sum{display:none}
  .sec-b{padding:2px 12px 11px;display:none}
  .sec.open .sec-b{display:block}
  .sec-h .acc{color:var(--accent)}
  /* sub-accordion for FX groups */
  .sub{border-top:1px solid #1f242c}
  .sub:first-child{border-top:0}
  .sub-h{display:flex;align-items:center;gap:7px;padding:7px 2px;cursor:pointer;font-size:12px;color:var(--ink)}
  .sub-h:hover{color:var(--accent)}
  .sub-h .tw{font-size:9px;color:var(--faint);width:9px;transition:transform .12s;display:inline-block}
  .sub.open .sub-h .tw{transform:rotate(90deg)}
  .sub-h .sum{margin-left:auto;color:var(--faint);font:11px ui-monospace,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
  .sub.open .sub-h .sum{color:var(--accent)}
  .sub-b{display:none;padding:1px 0 7px}
  .sub.open .sub-b{display:block}
  /* key/value rows */
  .kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;min-height:28px}
  .kv+.kv{border-top:1px solid #1c2128}
  .kv>span:first-child{color:var(--dim)}
  .kv .val{color:var(--accent);font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center}
  .kv .val.mut{color:var(--ink)}
  .stp{display:flex;align-items:center;gap:3px}
  .stp input[type=number]{width:50px;text-align:right}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 2px}
  .btnrow button{flex:1 1 auto}
  .hint{color:var(--faint);font-size:11px;margin:9px 0 2px;line-height:1.55}
  .hint b{color:var(--dim)}
  /* header controls */
  #globals{display:flex;gap:8px;align-items:center}
  #globals input[type=number]{width:50px;text-align:right}
  .zoom{display:flex;gap:2px;align-items:center;color:var(--dim);font-size:12px}
  .zoom button{padding:3px 6px;font-size:11px}
  /* global settings popover */
  #globalpop{position:absolute;top:48px;right:10px;width:250px;background:var(--panel2);
    border:1px solid var(--ctl-br);border-radius:var(--rad);box-shadow:0 12px 32px rgba(0,0,0,.55);
    padding:11px 13px;z-index:30;display:none}
  #globalpop.open{display:block}
  #globalpop h4{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  #scrim{position:fixed;inset:0;z-index:20;display:none}
  #scrim.open{display:block}
  select.full{width:100%}
  /* slider rows for wide-range continuous params (touch-friendly) */
  .slrow{padding:6px 0 9px}
  .slrow+.slrow,.kv+.slrow,.slrow+.kv{border-top:1px solid #1c2128}
  .sllab{display:flex;justify-content:space-between;align-items:center;color:var(--dim);
    font-size:12px;margin-bottom:3px;gap:8px}
  .sllab .slval{width:56px;text-align:right;padding:3px 6px}
  .slwrap{display:flex;align-items:center;gap:8px}
  .slwrap .nudge{flex:0 0 auto;padding:2px 8px;font-size:13px;line-height:1}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;width:100%;height:6px;
    border-radius:4px;background:#2a2f3a;outline:none;padding:0;margin:6px 0;border:0;cursor:pointer;
    touch-action:pan-y}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
    border-radius:50%;background:var(--accent);border:2px solid #0a1a19;box-shadow:0 1px 3px rgba(0,0,0,.5);cursor:grab}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);
    border:2px solid #0a1a19;box-shadow:0 1px 3px rgba(0,0,0,.5);cursor:grab}
  input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;background:#5fe0d8}
  input[type=range].bip{background:linear-gradient(90deg,#2a2f3a 0 calc(50% - 1px),#454c5a calc(50% - 1px) calc(50% + 1px),#2a2f3a calc(50% + 1px) 100%)}
.sitelinks{display:inline-flex;gap:2px;margin-left:4px;padding-left:8px;border-left:1px solid var(--line)}
.sitelinks a{color:var(--faint);font-size:11px;text-decoration:none;padding:4px 5px;border-radius:4px}
.sitelinks a:hover{color:var(--ink);background:#21262f}
/* sequencer-only header chrome hides in the other views (data-view is set by
 * setView; absent at boot = sequencer, so first paint shows everything) */
body[data-view="mix"] .seqonly,body[data-view="sound"] .seqonly{display:none}
/* ribbons (Tier 3): mini-mixer under the session grid + clip row in panels */
#miniribbon{flex:0 0 auto;display:flex;align-items:stretch;gap:6px;padding:3px 10px 4px;
  background:var(--panel);border-bottom:1px solid #000}
#ribToggle{flex:0 0 auto;background:transparent;border:0;color:#5d6d84;padding:0 4px;font-size:10px}
#ribcells{flex:1;display:flex;gap:6px;min-width:0}
.ribcell{flex:1;min-width:0;display:flex;align-items:center;gap:5px;padding:2px 6px;
  background:#12151c;border:1px solid #232a38;border-radius:6px;cursor:pointer}
.ribcell.sel{border-color:#3d7bd6}
.ribcell.ext{opacity:.35;cursor:default}
.ribcell.wait .ribbar,.ribcell.wait .ribms{opacity:.3;pointer-events:none}
.ribnum{font:10px ui-monospace,monospace;font-weight:700;flex:0 0 auto;cursor:pointer}
.ribbar{position:relative;flex:1;height:10px;background:#1a1f29;border-radius:3px;min-width:24px;
  touch-action:none;cursor:ew-resize;overflow:hidden}
.ribfill{position:absolute;left:0;top:0;bottom:0;opacity:.55;border-radius:3px 0 0 3px}
.ribnotch{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#48566e}
.ribms{display:flex;gap:2px;flex:0 0 auto}
.ribms button{font-size:8.5px;padding:0 4px;line-height:14px;border-radius:3px;border:1px solid #2a3140;
  background:#171b24;color:#5d6d84}
.ribms button.on.mute{background:#4a3210;color:#ffc86b;border-color:#6b4a1a}
.ribms button.on.solo{background:#123f21;color:#5fe08a;border-color:#1d5c31}
#clipribbon{display:flex;gap:6px;margin:0 0 12px;align-items:center}
.clipchip{width:26px;height:16px;border-radius:4px;cursor:pointer;font:10px/16px ui-monospace,monospace;
  text-align:center;color:#0b0d11;font-weight:800}
.clipchip.playing{box-shadow:inset 0 0 0 2px var(--play)}
.clipchip.queued{outline:1.5px dashed var(--play);outline-offset:-1px}
.clipchip.emptych{cursor:default}
/* mixer view (phase D) */
#mixer{display:none;flex:1;min-height:0;overflow:auto;padding:14px}
#mixer .strips{display:flex;gap:8px;align-items:stretch}
.strip{flex:1;min-width:86px;max-width:150px;display:flex;flex-direction:column;gap:6px;
  background:#12151c;border:1px solid #232a38;border-radius:10px;padding:8px 8px 10px;
  transition:opacity .15s}
.strip.sel{border-color:#3d7bd6;box-shadow:0 0 0 1px #3d7bd6 inset}
.strip.dim{opacity:.38}
.strip.wait input,.strip.wait .ms{opacity:.3;pointer-events:none}  /* syncing — values not in yet */
.strip.ext .ctl{visibility:hidden}
.strip .thead{cursor:pointer;text-align:center;line-height:1.25}
.strip .tnum{font-weight:700;font-size:12px;color:#dfe8f5}
.strip .inst{display:block;font-size:10.5px;color:#8fa4c0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.strip .mode{font-size:9px;color:#5d6d84;letter-spacing:.06em}
/* level fader: short fixed throw, narrow rail, ticked scale — minor tick each
 * 1/8 of travel, heavier tick at unity (mid-travel on the 0..2x range) */
.strip .fader{flex:0 0 auto;display:flex;justify-content:center;height:96px;margin:4px 0 2px}
.strip .fader input{
  -webkit-appearance:none;appearance:none;
  writing-mode:vertical-lr;direction:rtl;
  width:18px;height:100%;margin:0;border:0;cursor:pointer;
  background:
    linear-gradient(#48566e,#48566e) no-repeat 50% 50%/14px 2px,                /* unity */
    repeating-linear-gradient(to bottom,
      #262d3b 0,#262d3b 1px,transparent 1px,transparent 12.5%)
      no-repeat 50% 0/10px 100%,                                                /* ticks */
    linear-gradient(#232a38,#232a38) no-repeat 50% 0/4px 100%;                  /* rail */
}
.strip .fader input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:16px;height:9px;border-radius:2px;background:#dfe8f5;
  border:1px solid #0b0d11;box-shadow:0 1px 3px rgba(0,0,0,.55)}
.strip .fader input::-moz-range-track{background:transparent}
.strip .fader input::-moz-range-thumb{width:16px;height:9px;border-radius:2px;
  background:#dfe8f5;border:1px solid #0b0d11}
.strip .val{text-align:center;font:10.5px ui-monospace,monospace;color:#9fb4d0;min-height:13px}
.strip .ctl label{display:block;font-size:9px;color:#5d6d84;text-align:center;letter-spacing:.05em}
.strip .ctl input{width:100%}
.strip .ms{display:flex;gap:4px;justify-content:center}
.strip .ms button{flex:1;font-size:10px;padding:2px 0;border-radius:5px;border:1px solid #2a3140;
  background:#171b24;color:#8fa4c0;cursor:pointer}
.strip .ms button.on.mute{background:#4a3210;color:#ffc86b;border-color:#6b4a1a}
.strip .ms button.on.solo{background:#123f21;color:#5fe08a;border-color:#1d5c31}
.strip .mslabel{font-size:8.5px;color:#4d5b70;text-align:center;letter-spacing:.06em}
.strip .ext-note{font-size:10px;color:#5d6d84;text-align:center;margin-top:8px}
/* sound view — the selected track's signal path, left to right, ending in its
   mixer strip. Cards are a fixed-width row that scrolls horizontally; the page
   body never scrolls sideways. */
#sound{display:none;flex:1;min-height:0;overflow:auto;padding:14px}
#soundwrap{display:flex;flex-direction:column;gap:10px;min-height:0}
.sndheadbar{display:flex;align-items:center;gap:12px}
.sndtracks{display:flex;gap:4px}
.sndchip{width:22px;height:22px;padding:0;border:0;border-radius:5px;cursor:pointer;
  font:700 10px ui-monospace,monospace;color:#0b0d11;opacity:.55;transition:opacity .12s}
.sndchip:hover{opacity:.85}
.sndchip.sel{opacity:1;outline:2px solid #dfe8f5;outline-offset:-1px}
.sndhead{font-size:13px;font-weight:700;color:#dfe8f5;letter-spacing:.02em}
/* two panes: the signal path stacks VERTICALLY (top → bottom = signal order),
 * the audio strip rides the right as a sticky sidebar */
.sndcards{display:flex;gap:12px;align-items:flex-start}
/* NO max-width: a hosted instrument editor is the widest thing this app shows
 * (obxd and osirus both declare a 980px layout), and a 620px cap clipped every
 * one of them. Stock's .custom-ui-container is plain width:100% for the same
 * reason — the column is as wide as the pane, minus the sticky audio strip. */
.sndchain{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.sndcard{display:flex;flex-direction:column;
  background:#12151c;border:1px solid #232a38;border-radius:10px;overflow:hidden}
.sndcard-mix{flex:0 0 120px;position:sticky;top:0}
.sndcard-h{display:flex;align-items:center;gap:6px;padding:7px 9px;background:#161a23;
  border-bottom:1px solid #232a38}
.sndrole{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:#5d6d84;flex:0 0 auto}
.sndmod{font-size:11px;color:#dfe8f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sndbypass{flex:0 0 auto;font-size:9px;padding:2px 6px;border-radius:5px;border:1px solid #2a3140;
  background:#171b24;color:#5d6d84;cursor:pointer}
.sndbypass.on{background:#4a3210;color:#ffc86b;border-color:#6b4a1a}
.sndcard-b{padding:9px;flex:1;min-height:0;overflow:auto}
.sndcard-mix .sndcard-b{display:flex;padding:8px}
.sndcard-mix .strip{flex:1;max-width:none;min-width:0;background:transparent;border:0;padding:0}
.sndnote{font-size:11px;color:#9fb4d0;line-height:1.5}
.sndnote.dim{color:#5d6d84}
/* stock's .custom-ui-iframe law: full width, min 400px tall, 60vh */
.sndpanel{display:block;width:100%;min-height:400px;height:60vh;border:0;border-radius:6px;
  background:#0b0d11}
/* Custom UI / Generic switch + open-in-tab, both in the card header
 * (stock: .ui-mode-toggle + .custom-ui-popout-btn in the slot header) */
.sndui{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.snduigroup{display:inline-flex;border:1px solid #2a3140;border-radius:5px;overflow:hidden}
.snduibtn{font-size:9px;padding:2px 7px;border:0;background:#171b24;color:#5d6d84;
  cursor:pointer;font-family:inherit;line-height:1.6}
.snduibtn:hover{color:#dfe8f5;background:#21262f}
.snduibtn.active{background:#1b2430;color:#5fe0d8;font-weight:700}
.sndopen{flex:0 0 auto;font-size:10.5px;color:#5fa8e0;text-decoration:none;white-space:nowrap}
.sndopen:hover{text-decoration:underline}
/* generated param editor (web_ui_params.js) — self-contained, cpk- prefixed */
.cpk{display:flex;flex-direction:column;gap:8px;color:#9fb4d0;font-size:11.5px}
.cpk-title{font-size:10px;letter-spacing:.08em;color:#5d6d84;text-transform:uppercase}
.cpk-empty{font-size:11px;color:#5d6d84;font-style:italic}
/* collapsible banks — a level is a section you open, not a place you go */
.cpk-bank{border:1px solid #212836;border-radius:7px;background:#10141b;overflow:hidden}
.cpk-bankhead{display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;
  border:0;background:#161a23;color:#9fb4d0;cursor:pointer;text-align:left;
  font-family:inherit;font-size:11px}
.cpk-bankhead:hover{background:#1b2029;color:#dfe8f5}
.cpk-bank.open>.cpk-bankhead{color:#dfe8f5}
.cpk-bankarrow{flex:0 0 auto;font-size:8px;color:#5d6d84}
.cpk-banklabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpk-bankbody{display:flex;flex-direction:column;gap:8px;padding:8px}
.cpk-presets{display:flex;align-items:center;gap:6px}
.cpk-presetnav{font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid #2a3140;
  background:#171b24;color:#9fb4d0;cursor:pointer}
.cpk-presetnav:disabled{opacity:.35;cursor:default}
.cpk-presetname{flex:1;font:11px ui-monospace,monospace;color:#dfe8f5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpk-knobs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.cpk-knob{width:66px;display:flex;flex-direction:column;align-items:center;gap:1px;
  cursor:ns-resize;touch-action:none;user-select:none}
.cpk-knob-svg{display:block}
.cpk-knob-label{font-size:9.5px;color:#5d6d84;text-align:center;max-width:66px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpk-knob-value{font:10px ui-monospace,monospace;color:#dfe8f5}
.cpk-list{display:flex;flex-direction:column}
.cpk-row{display:flex;align-items:center;gap:8px;padding:5px 0;min-height:26px}
.cpk-row+.cpk-row{border-top:1px solid #1c2128}
.cpk-label{flex:0 0 40%;color:#9fb4d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpk-ctl{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.cpk-ctl input[type=range]{flex:1;min-width:0;margin:0}
.cpk-val{flex:0 0 auto;font:10px ui-monospace,monospace;color:#dfe8f5;min-width:38px;text-align:right}
.cpk-select,.cpk-text{flex:1;min-width:0;font-size:11px;padding:3px 5px}
.cpk-toggle{font-size:10px;padding:2px 8px;border-radius:5px;border:1px solid #2a3140;
  background:#171b24;color:#9fb4d0;cursor:pointer}
.cpk-toggle.on{background:#123f21;color:#5fe08a;border-color:#1d5c31}
/* a parameter the module lists but publishes no metadata for: never silent */
.cpk-row.cpk-nometa .cpk-label{font-family:ui-monospace,monospace;color:#ffc86b}
.cpk-warn{font-size:9px;color:#ffc86b;border:1px solid #6b4a1a;background:#241d09;
  border-radius:4px;padding:1px 4px;white-space:nowrap}
.cpk-knob.cpk-nometa .cpk-knob-label{color:#ffc86b;font-family:ui-monospace,monospace}
/* cross-view jumps (Tier 1) + view transitions (Tier 2) */
.viewfade{animation:viewfade .15s ease-out}
@keyframes viewfade{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
.strip .inst{cursor:pointer}
.strip .inst:hover{color:#dfe8f5;text-decoration:underline}
.sndhead{cursor:pointer}
.sndhead:hover{color:#fff}
.strip .val.linky{cursor:pointer}
.strip .val.linky:hover{color:#dfe8f5;text-decoration:underline}
.strip.pulse{animation:strippulse .9s ease-out}
@keyframes strippulse{0%{box-shadow:0 0 0 3px #3d7bd6}100%{box-shadow:none}}
.trkgear .tgviews{display:flex;gap:6px;align-items:center}
.trkgear .tgviews span{margin:0 auto 0 0;font-size:11px;color:var(--dim)}
/* connection pill (C5) + DIAG overlay (C1) */
#connpill.live{background:#123f21;color:#5fe08a;border-color:#1d5c31}
#connpill.recon{background:#4a3210;color:#ffc86b;border-color:#6b4a1a}
#connpill.notool{background:#4a1515;color:#ff8f8f;border-color:#6b2020}
#diag{position:fixed;right:8px;bottom:8px;z-index:99;background:rgba(10,12,16,.92);
  border:1px solid #2a3140;border-radius:8px;padding:8px 10px;font:11px/1.5 ui-monospace,monospace;
  color:#9fb4d0;min-width:230px;white-space:pre;display:none}
#diag b{color:#dfe8f5}
</style></head>
<body><div id="app">
  <div id="top">
    <span class="brand">dAVEBO<span class="dot">x</span></span>
    <span class="badge pill" id="connpill" title="Connection to the Move — ~ toggles diagnostics">…</span>
    <span class="seg views" id="viewseg" title="Views — the selected track is shared across them">
      <button id="viewSeq" class="on">Sequencer</button>
      <button id="viewMix">Mixer</button>
      <button id="viewSound">Sound</button></span>
    <button class="ghost" id="xport" title="Start / stop transport">▶</button>
    <span class="badge play" id="transport">—</span>
    <span id="globals"></span>
    <span class="badge clip" id="clipname">—</span>
    <span class="badge warn" id="trunc" title="This clip has more notes/automation than the editor can load — some are hidden. Thin the clip on-device to edit them." style="display:none">⚠ clip too dense — some notes hidden</span>
    <span class="spacer"></span>
    <span class="seg tools seqonly" title="Edit tool — B Draw · V Select · E Erase · Del removes selection · arrows nudge · ⌘A all">
      <button id="toolDraw" class="on" title="Draw (B) — tap to add, drag to move, edge to resize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l3.6-.9L18 8.7 15.3 6 4.9 16.4 4 20z"/><path d="M13.4 7.9l2.7 2.7"/></svg></button>
      <button id="toolSel" title="Select (V) — marquee to select many; edit note params together · ⌘A all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="1.5" stroke-dasharray="2.6 3"/></svg></button>
      <button id="toolErase" title="Erase (E) — tap or swipe a note to delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 17.5l-2.6-2.6a1.6 1.6 0 0 1 0-2.3l7-7a1.6 1.6 0 0 1 2.3 0l4 4a1.6 1.6 0 0 1 0 2.3L12.7 18H8z"/><path d="M8.2 11.2l4.6 4.6M10.5 20.5H21"/></svg></button></span>
    <span class="seg seqonly" title="Undo / Redo (global · ⌘Z / ⌘⇧Z)">
      <button id="hUndo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L5 11l4 4"/><path d="M5 11h9a5 5 0 0 1 0 10h-3"/></svg></button>
      <button id="hRedo" title="Redo (⌘⇧Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l4 4-4 4"/><path d="M19 11h-9a5 5 0 0 0 0 10h3"/></svg></button></span>
    <span class="zoom seqonly" title="Ctrl+wheel = H zoom · Ctrl+Shift+wheel = V zoom">
      <span class="seg"><button id="zxout" title="Zoom out (horizontal)">H−</button><button id="zxin" title="Zoom in (horizontal)">H+</button></span>
      <span class="seg"><button id="zyout" title="Zoom out (vertical)">V−</button><button id="zyin" title="Zoom in (vertical)">V+</button></span>
      <button class="ghost" id="zrst" title="Reset / fit zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg></button></span>
    <label class="seqonly">Snap <select id="snap">
      <option value="6">1/64</option><option value="12">1/32</option>
      <option value="24" selected>1/16</option><option value="48">1/8</option>
      <option value="96">1/4</option><option value="0">Off</option></select></label>
    <button class="ghost seqonly" id="sessToggle" title="Show / hide the session grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
    <button class="ghost" id="gear" title="Global settings (key, scale, swing, launch)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V15z"/></svg></button>
    <button class="ghost" id="sync" title="Re-pull from device"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3.5v6h-6"/></svg></button>
    <button id="auto" class="on sm" title="Auto-refresh from device">Auto</button>
    <span class="sitelinks"><a href="/mirror" target="_blank" rel="noopener" title="Live view of the Move's screen">Mirror</a><a href="/files" target="_blank" rel="noopener" title="Browse files on the device">Files</a><a href="/help" target="_blank" rel="noopener" title="Manual & help">Help</a></span>
  </div>
  <div id="session"><div id="grid" title="tracks × scenes — click a clip to launch it (editor follows, like the hardware); Alt/Shift-click to view without launching; ▶ launches a scene"></div></div>
  <div id="miniribbon"><button id="ribToggle" title="Show / hide the level ribbon">▾</button><div id="ribcells"></div></div>
  <div id="main">
    <div id="rollwrap">
      <div id="rollview">
        <canvas id="rollcanvas"></canvas>
        <div id="drumph">
          <div>This track is in <b>Drum</b> mode but has no drum clip yet.</div>
          <div>Add a hit on the device, or pick a melodic track.</div>
        </div>
        <div id="playhead"></div>
        <div class="zoomstrip zh" id="zstripH" title="Zoom horizontally — drag down to zoom in, up to zoom out">↕ ZOOM ↕</div>
        <div class="zoomstrip zv" id="zstripV" title="Zoom vertically — drag right to zoom in, left to zoom out">↔</div>
      </div>
      <div class="bandhdr" id="velhdr" title="Show / hide the velocity lane"><span class="tw">▼</span><span class="bl">Velocity</span></div>
      <div id="velwrap"><div class="lane-rs" data-for="velwrap" title="drag to resize"></div><canvas id="velcanvas"></canvas></div>
      <div class="bandhdr" id="autohdr" title="Show / hide CC automation (per clip)"><span class="tw">▶</span><span class="bl">Automation</span><span class="bsum" id="autohsum"></span></div>
      <div id="autopick"></div>
      <div id="autoctl"></div>
      <div id="autowrap"><div class="lane-rs" data-for="autowrap" title="drag to resize"></div><canvas id="autocanvas"></canvas></div>
      <div id="editbar">
        <div id="noteedit" class="ebgrp"></div>
        <div id="stepedit" class="ebgrp"></div>
      </div>
    </div>
    <div id="side"><div id="inspector"></div></div>
  </div>
  <div id="scrim"></div>
  <div id="globalpop"><h4>Global settings</h4><div id="globalpanel"></div></div>
  <div id="mixer"><div id="clipribbon"></div><div class="strips" id="mixstrips"></div></div>
  <div id="sound"><div id="soundwrap"></div></div>
</div>
<div id="diag"></div>

<script src="/static/schwung-remote-api.js"></script>
<script src="web_ui_core.js"></script>
<script src="web_ui_seq.js"></script>
<script src="web_ui_mix.js"></script>
<script src="web_ui_params.js"></script>
<script src="web_ui_ribbon.js"></script>
<script src="web_ui_sound.js"></script>
</body></html>
