  <title>Drum track pads</title>
  <desc>A drum track splits the pads in two. The left 4 by 4 holds drum lanes 1 to 16 of bank A, lane 1 at the bottom left; + and − switch to bank B, lanes 17 to 32. The right 4 by 4 holds velocity zones from 8 at the bottom left to 127 at the top right. Shift + Step 8 turns the right half into Note Repeat: straight rates on the bottom row, triplet rates above, and the gate mask, steps 1 to 8, on the top two rows.</desc>
