<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" font-family="Jost, system-ui, sans-serif" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title>The note chain</title>
  <desc>What you play live passes through LIVE ARP or Note Repeat first. It then joins the sequenced notes, and both pass through NOTE FX, HARMONY, DELAY and SEQ ARP in that order before they reach the instrument.</desc>
  <defs>
    <marker id="nc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="1.5" transform="translate(0 22)">
    <path d="M2 30 H20" marker-end="url(#nc-arrow)"/>
    <rect x="24" y="10" width="210" height="40" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <path d="M234 30 H248 V80 H262" marker-end="url(#nc-arrow)"/>
    <path d="M150 130 H248 V80"/>
    <rect x="266" y="60" width="96" height="40" rx="4" fill="currentColor" fill-opacity="0.16"/>
    <path d="M362 80 H380" marker-end="url(#nc-arrow)"/>
    <rect x="384" y="60" width="104" height="40" rx="4" fill="currentColor" fill-opacity="0.16"/>
    <path d="M488 80 H506" marker-end="url(#nc-arrow)"/>
    <rect x="510" y="60" width="86" height="40" rx="4" fill="currentColor" fill-opacity="0.16"/>
    <path d="M596 80 H614" marker-end="url(#nc-arrow)"/>
    <rect x="618" y="60" width="96" height="40" rx="4" fill="currentColor" fill-opacity="0.16"/>
    <path d="M714 80 H732" marker-end="url(#nc-arrow)"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="17" text-anchor="middle" transform="translate(0 22)">
    <text x="129" y="36">LIVE ARP / Note Repeat</text>
    <text x="24" y="2" font-size="15" text-anchor="start" fill-opacity="0.75">Live input</text>
    <text x="72" y="136">Sequenced notes</text>
    <text x="314" y="86">NOTE FX</text>
    <text x="436" y="86">HARMONY</text>
    <text x="553" y="86">DELAY</text>
    <text x="666" y="86">SEQ ARP</text>
    <text x="748" y="86" font-size="15">Out</text>
  </g>
</svg>
