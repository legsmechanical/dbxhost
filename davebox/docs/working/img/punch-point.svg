<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Jost, system-ui, sans-serif" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title>A punch and a point</title>
  <desc>The same lane, eight steps long, with something set on step 4. Left, a punch: the value jumps up as step 4 starts, is held flat for the step, and jumps back to the lane when it ends. Right, a point: the lane glides up into the point on step 4 and glides on from it.</desc>
  <!-- left: punch -->
  <g transform="translate(10 40)">
    <rect x="140" y="20" width="40" height="120" fill="currentColor" fill-opacity="0.08" stroke="none"/>
    <g stroke-width="1" stroke-opacity="0.25">
      <path d="M20 20 V140 M60 20 V140 M100 20 V140 M140 20 V140 M180 20 V140 M220 20 V140 M260 20 V140 M300 20 V140 M340 20 V140"/>
      <path d="M20 140 H340"/>
    </g>
    <path d="M20 100 L140 92.5 V45 H180 V90 L340 80" stroke-width="2.5"/>
    <circle cx="20" cy="100" r="4" fill="currentColor" stroke="none"/>
    <circle cx="340" cy="80" r="4" fill="currentColor" stroke="none"/>
  </g>
  <!-- right: point -->
  <g transform="translate(400 40)">
    <rect x="140" y="20" width="40" height="120" fill="currentColor" fill-opacity="0.08" stroke="none"/>
    <g stroke-width="1" stroke-opacity="0.25">
      <path d="M20 20 V140 M60 20 V140 M100 20 V140 M140 20 V140 M180 20 V140 M220 20 V140 M260 20 V140 M300 20 V140 M340 20 V140"/>
      <path d="M20 140 H340"/>
    </g>
    <path d="M20 100 L160 45 L340 80" stroke-width="2.5"/>
    <circle cx="20" cy="100" r="4" fill="currentColor" stroke="none"/>
    <circle cx="160" cy="45" r="5" fill="currentColor" stroke="none"/>
    <circle cx="340" cy="80" r="4" fill="currentColor" stroke="none"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="17">
    <text x="30" y="22">Punch (a lock)</text>
    <text x="420" y="22">Point ([Shift] while holding)</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="13" fill-opacity="0.7" text-anchor="middle">
    <text x="170" y="196">step 4: held flat, then back to the lane</text>
    <text x="560" y="196">step 4: the lane glides in and out</text>
  </g>
</svg>
