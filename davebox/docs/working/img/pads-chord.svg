  <title>Melodic pads, Chord layout</title>
  <desc>The 4 by 8 pads in the Chord layout, in C major. Bottom row: eight chords, I ii iii IV V vi vii° and I an octave up, shaded by function. Row 2: the modifiers 7, 9, sus2, sus4, add9 and 5, then Inv− and Inv+. Row 3: the notes of the last chord played, rising. Top row: the scale with the root on the fourth pad.</desc>
