<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dAVEBOx SA Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Chivo:wght@800&family=JetBrains+Mono:wght@500&display=swap">
<meta name="description" content="The dAVEBOx SA user manual: an 8-track sequencer and sampler for Ableton Move.">
<style>
/* Generated by davebox/tools/build_manual_html.mjs from the manual draft — do not hand-edit.
 * Layout after the official Move manual: one plain white page, a single reading column, numbered
 * headings in line with their titles, pictures with a short caption under them, few rules and no
 * boxes. One geometric reading face (Jost), falling back to the system font offline. */
:root {
  --ground: #ffffff;
  --ink: #000000;
  --ink-soft: #2b2b2b;
  --muted: #6b6b6b;
  --rule: #e2e2e2;
  --rule-strong: #c4c4c4;
  --panel: #f4f4f4;
  --accent: #0000ff;
  --code-bg: #f1f1f1;
  --mark: #fff27a;
  --f-body: "Jost", "Futura", "Century Gothic", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  /* the dAVEBOx wordmark, as the earlier manual drew it */
  --f-display: "Chivo", "Helvetica Neue", Arial, sans-serif;
  --f-brandmono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --brand: #bf2f7c;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side: 16.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #111111; --ink: #f2f2f2; --ink-soft: #d6d6d6; --muted: #9a9a9a;
    --rule: #2c2c2c; --rule-strong: #474747; --panel: #1c1c1c; --accent: #8ea2ff; --code-bg: #222222; --mark: #5a4d00; --brand: #ff5fa8;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #111111; --ink: #f2f2f2; --ink-soft: #d6d6d6; --muted: #9a9a9a;
  --rule: #2c2c2c; --rule-strong: #474747; --panel: #1c1c1c; --accent: #8ea2ff; --code-bg: #222222; --mark: #5a4d00; --brand: #ff5fa8;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 1.5rem; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 1.125rem/1.7 var(--f-body); }
a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── sidebar: the contents, flat ── */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side);
  background: var(--ground); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; z-index: 20; font-size: .9375rem;
}
.side a { text-decoration: none; }
.brand { padding: 1.25rem 1.25rem .5rem; }
.brand a { color: var(--ink); text-decoration: none; display: flex; align-items: baseline; gap: .5rem; }
.wordmark { font: 800 1.35rem/1 var(--f-display); letter-spacing: -.01em; }
.wordmark .sa, .hero h1 .sa { color: var(--brand); }
.brand .sub { font: 500 .7rem/1 var(--f-brandmono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.search { padding: .25rem 1rem .75rem; }
.search input {
  width: 100%; font: inherit; color: var(--ink); background: var(--ground);
  border: 1px solid var(--rule-strong); border-radius: 0; padding: .35rem .6rem;
}
.search input::placeholder { color: var(--muted); }
.nav { overflow-y: auto; padding: 0 .6rem 2rem; flex: 1; overscroll-behavior: contain; }
.part { margin-top: 1.1rem; }
.ptitle { font-weight: 500; color: var(--muted); padding: 0 .65rem .25rem; font-size: .8125rem; text-transform: uppercase; letter-spacing: .06em; }
.nav ol { list-style: none; margin: 0; padding: 0; }
.nav > .part > ol > li > a { display: flex; gap: .5rem; padding: .2rem .65rem; color: var(--ink); line-height: 1.35; }
.nav .n { color: var(--muted); min-width: 1.3rem; text-align: right; font-variant-numeric: tabular-nums; }
.nav a:hover { color: var(--accent); }
.nav li.active > a { color: var(--accent); font-weight: 500; }
.nav li.active > a .n { color: var(--accent); }
.nav .subs { display: none; margin: .1rem 0 .5rem 2.45rem; }
.nav li.active > .subs { display: block; }
.nav .subs a { display: block; padding: .12rem .2rem; color: var(--muted); line-height: 1.35; font-size: .875rem; }
.nav .subs a.on { color: var(--ink); }
.results { display: none; padding: .25rem .6rem 2rem; overflow-y: auto; flex: 1; }
.results a { display: block; padding: .45rem .65rem; color: var(--ink); }
.results a:hover, .results a.sel { background: var(--panel); }
.results .rt { font-weight: 500; line-height: 1.3; }
.results .rc { font-size: .75rem; color: var(--muted); }
.results .rs { font-size: .8125rem; color: var(--muted); line-height: 1.4; margin-top: .1rem; }
.results mark { background: var(--mark); color: inherit; }
.results .none { color: var(--muted); padding: .45rem .65rem; }
.side.searching .nav { display: none; }
.side.searching .results { display: block; }
.side-foot { padding: .6rem 1.25rem; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .8125rem; }
.theme-btn { font: inherit; color: var(--muted); background: none; border: 1px solid var(--rule); padding: .1rem .5rem; cursor: pointer; }
.theme-btn:hover { color: var(--ink); border-color: var(--rule-strong); }

/* ── mobile bar ── */
.topbar { display: none; }
@media (max-width: 960px) {
  .side { transform: translateX(-100%); transition: transform .2s ease; width: min(19rem, 86vw); }
  .side.open { transform: none; }
  .topbar {
    display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; align-items: center; gap: .9rem;
    padding: .55rem max(16px, env(safe-area-inset-right, 0px)) .55rem max(16px, env(safe-area-inset-left, 0px));
    background: var(--ground); border-bottom: 1px solid var(--rule); font-weight: 500;
  }
  .topbar .wordmark { font-size: 1.1rem; }
  .topbar button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--rule-strong); padding: .2rem .7rem; cursor: pointer; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 18; display: none; }
  .scrim.on { display: block; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* ── the page ── */
main { margin-left: var(--side); padding-block: 3rem 5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 960px) { main { margin-left: 0; padding-top: 1.5rem; } }
.col { max-width: 42rem; margin: 0 auto; }
.sheet { min-width: 0; }
.chapter { margin-top: 4.5rem; }

.hero h1 { font: 800 clamp(2.4rem, 6vw, 3.6rem)/1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.hero .ver { color: var(--muted); margin: .4rem 0 2rem; }
.intro h2 { font-size: 1.5rem; font-weight: 500; margin: 2.5rem 0 .6rem; }
.toc { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.5rem 2rem; margin: 2.5rem 0 0; }
.toc h3 { font-size: .8125rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 .35rem; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li { margin: .1rem 0; display: flex; gap: .5rem; }
.toc .n { color: var(--muted); min-width: 1.4rem; text-align: right; font-variant-numeric: tabular-nums; }
.toc a { color: var(--ink); }
.toc a:hover { color: var(--accent); text-decoration: none; }

/* headings: the number in line with the title, as in Move's manual */
.chhead { display: flex; align-items: baseline; gap: .35em; margin: 0 0 1.25rem; }
.chnum { font-size: 2.25rem; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
.chnum::after { content: "."; }
.chhead h1 { font-size: 2.25rem; font-weight: 500; line-height: 1.15; margin: 0; text-wrap: balance; }
.chapter h2 { font-size: 1.625rem; font-weight: 500; line-height: 1.25; margin: 3rem 0 .75rem; text-wrap: balance; }
.chapter h2 .secnum { font-variant-numeric: tabular-nums; margin-right: .4em; }
.chapter h3 { font-size: 1.3125rem; font-weight: 500; line-height: 1.3; margin: 2.25rem 0 .5rem; }
.chapter h4 { font-size: 1.125rem; font-weight: 500; margin: 1.75rem 0 .4rem; }
p, ul, ol { margin: 0 0 1.1rem; }
ul, ol { padding-left: 1.4rem; }
li { margin: .25rem 0; }
li > ul, li > ol { margin: .25rem 0 .5rem; }
strong { font-weight: 600; }
code { font: .85em var(--f-mono); background: var(--code-bg); padding: .1em .3em; }

/* button names read as plain words, as in Move's manual */
kbd { font: inherit; color: inherit; background: none; border: 0; padding: 0; white-space: nowrap; }
.keys { font-weight: inherit; }
.kjoin { color: inherit; }

/* tables: thin rules, no shading */
.tablewrap { overflow-x: auto; margin: 0 0 1.5rem; }
table { border-collapse: collapse; width: 100%; font-size: 1rem; line-height: 1.5; }
th, td { border-bottom: 1px solid var(--rule); padding: .55rem .9rem .55rem 0; text-align: left; vertical-align: top; }
th { font-weight: 500; border-bottom: 1px solid var(--ink); }
td:first-child { font-weight: 500; }
@media (max-width: 600px) { th, td { padding-right: .6rem; } table { font-size: .9375rem; } }

/* notes: a plain paragraph with its kind in front, no box */
.callout { margin: 1.25rem 0; }
.callout .clabel { font-weight: 600; display: inline; margin-right: .35em; }
.callout .clabel::after { content: ":"; }
.callout .clabel + p { display: inline; }
.callout > :last-child, .callout > :last-child > :last-child { margin-bottom: 0; }
p.video { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem; font-size: 1rem; margin: 0 0 1.1rem; }
p.video .vtag { flex: none; font-weight: 600; }
p.video .vtag::after { content: ":"; }

pre.diagram {
  font: .8125rem/1.45 var(--f-mono); background: var(--panel);
  padding: .9rem 1rem; overflow-x: auto; margin: 0 0 1.5rem;
}

/* pictures with a short caption under them */
.figs { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin: 1.5rem 0 1.75rem; }
.figs.multi { grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
figure { margin: 0; min-width: 0; }
.bezel { background: #000; padding: 8px; max-width: 24rem; }
.figs.multi .bezel { max-width: none; }
.bezel img { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 2 / 1; image-rendering: pixelated; image-rendering: crisp-edges; }
figure.diagram { color: var(--ink); }
figure.diagram svg { display: block; width: 100%; height: auto; }
figure.shot img { display: block; width: 100%; height: auto; }
figcaption { font-size: .875rem; line-height: 1.45; color: var(--ink-soft); margin-top: .5rem; }
.ftitle { font-weight: 600; color: var(--ink); }

details.fold { margin: 0 0 1.1rem; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
details.fold > summary { cursor: pointer; padding: .55rem 0; font-weight: 500; }
details.fold[open] > summary { margin-bottom: .5rem; }

.colophon { font-size: .8125rem; color: var(--muted); margin: 4rem 0 0; }

@media print {
  .side, .topbar, .scrim { display: none !important; }
  main { margin: 0; padding: 0; }
  .chapter { break-before: page; margin-top: 0; }
}
</style>
</head>
<body>

<div class="topbar">
  <button type="button" id="menuBtn" aria-controls="side" aria-expanded="false">Contents</button>
  <span class="wordmark">dAVEBOx <span class="sa">SA</span></span>
</div>
<div class="scrim" id="scrim"></div>

<aside class="side" id="side">
  <div class="brand"><a href="#top"><span class="wordmark">dAVEBOx <span class="sa">SA</span></span><span class="sub">Manual</span></a></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search  ( / )" autocomplete="off" aria-label="Search the manual">
  </div>
  <nav class="nav" id="nav">{{NAV}}</nav>
  <div class="results" id="results" role="listbox"></div>
  <div class="side-foot"><span>Version {{VERSION}}</span><button class="theme-btn" id="themeBtn" type="button">Theme</button></div>
</aside>

<main id="top">
  <div class="col">
    <header class="hero sheet">
      <h1>dAVEBOx <span class="sa">SA</span></h1>
      <p class="ver">User manual · version {{VERSION}}</p>
      <div class="intro">{{INTRO}}</div>
      <nav class="toc" aria-label="Contents">{{TOC}}</nav>
    </header>
    {{CHAPTERS}}
    <p class="colophon">Every screen in this manual is drawn by dAVEBOx's own display code, rendered off the device. Generated from the manual source; {{SCREENCOUNT}} screens.</p>
  </div>
</main>
<script>
(() => {
  const side = document.getElementById('side');
  const nav = document.getElementById('nav');
  const q = document.getElementById('q');
  const results = document.getElementById('results');
  const menuBtn = document.getElementById('menuBtn');
  const scrim = document.getElementById('scrim');

  /* mobile drawer */
  const setOpen = (on) => { side.classList.toggle('open', on); scrim.classList.toggle('on', on); menuBtn.setAttribute('aria-expanded', on); };
  menuBtn.addEventListener('click', () => setOpen(!side.classList.contains('open')));
  scrim.addEventListener('click', () => setOpen(false));
  side.addEventListener('click', (e) => { if (e.target.closest('a')) setOpen(false); });

  /* theme: system → light → dark */
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const themes = [null, 'light', 'dark'];
  let ti = 0;
  try { const t = localStorage.getItem('dbx-manual-theme'); if (t) { ti = themes.indexOf(t); root.dataset.theme = t; } } catch (e) {}
  const label = () => { themeBtn.textContent = 'Theme: ' + (themes[ti] || 'auto'); };
  label();
  themeBtn.addEventListener('click', () => {
    ti = (ti + 1) % themes.length;
    if (themes[ti]) root.dataset.theme = themes[ti]; else delete root.dataset.theme;
    try { themes[ti] ? localStorage.setItem('dbx-manual-theme', themes[ti]) : localStorage.removeItem('dbx-manual-theme'); } catch (e) {}
    label();
  });

  /* scrollspy: the chapter in view opens its section list; the section in view is marked */
  const chapterEls = [...document.querySelectorAll('section.chapter')];
  const secEls = [...document.querySelectorAll('section.chapter h2[id]')];
  const navLi = new Map([...nav.querySelectorAll('li[data-ch]')].map((li) => [li.dataset.ch, li]));
  const subA = new Map([...nav.querySelectorAll('.subs a')].map((a) => [a.getAttribute('href').slice(1), a]));
  let curCh = null, curSec = null;
  const spy = () => {
    const y = window.innerHeight * 0.25;
    let ch = null; for (const c of chapterEls) { if (c.getBoundingClientRect().top <= y) ch = c; else break; }
    let sec = null; if (ch) for (const h of ch.querySelectorAll('h2[id]')) { if (h.getBoundingClientRect().top <= y) sec = h; else break; }
    const chId = ch && ch.id, secId = sec && sec.id;
    if (chId !== curCh) {
      if (curCh && navLi.get(curCh)) navLi.get(curCh).classList.remove('active');
      if (chId && navLi.get(chId)) {
        const li = navLi.get(chId); li.classList.add('active');
        const r = li.getBoundingClientRect(), nr = nav.getBoundingClientRect();
        if (r.top < nr.top || r.top > nr.bottom - 80) nav.scrollTop += r.top - nr.top - 40;
      }
      curCh = chId;
    }
    if (secId !== curSec) {
      if (curSec && subA.get(curSec)) subA.get(curSec).classList.remove('on');
      if (secId && subA.get(secId)) subA.get(secId).classList.add('on');
      curSec = secId;
    }
  };
  let raf = 0;
  window.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; spy(); }); }, { passive: true });
  spy();

  /* search: every h2/h3 with the text beneath it, ranked by where the words hit */
  const index = [];
  for (const ch of chapterEls) {
    const chTitle = ch.dataset.title;
    const chNum = ch.dataset.num;
    const numbered = /^\d+$/.test(chNum);
    let cur = { id: ch.id, title: chTitle, chapter: numbered ? 'Chapter ' + chNum : 'Walkthrough', text: '' };
    index.push(cur);
    for (const el of ch.children) {
      if (/^H[23]$/.test(el.tagName) && el.id) {
        cur = { id: el.id, title: el.textContent, chapter: (numbered ? chNum + '. ' : '') + chTitle, text: '' };
        index.push(cur);
      } else {
        cur.text += ' ' + el.textContent;
      }
    }
  }
  index.forEach((e) => { e.text = e.text.replace(/\s+/g, ' ').trim(); e.lt = e.title.toLowerCase(); e.lx = e.text.toLowerCase(); });
  const escH = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const markUp = (s, terms) => { let h = escH(s); for (const t of terms) h = h.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); return h; };
  let hits = [], sel = 0;
  const run = () => {
    const raw = q.value.trim().toLowerCase();
    side.classList.toggle('searching', !!raw);
    if (!raw) { results.innerHTML = ''; return; }
    const terms = raw.split(/\s+/).filter(Boolean);
    hits = index.map((e) => {
      let score = 0;
      for (const t of terms) {
        const inT = e.lt.includes(t), inX = e.lx.includes(t);
        if (!inT && !inX) return null;
        score += inT ? 10 : 0; score += inX ? Math.min(5, e.lx.split(t).length - 1) : 0;
      }
      return { e, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 30);
    sel = 0;
    if (!hits.length) { results.innerHTML = '<div class="none">No sections match “' + escH(raw) + '”.</div>'; return; }
    results.innerHTML = hits.map(({ e }, i) => {
      const p = e.lx.indexOf(terms[0]);
      const snip = p >= 0 ? (p > 40 ? '…' : '') + e.text.slice(Math.max(0, p - 40), p + 90) + '…' : '';
      return '<a href="#' + e.id + '"' + (i === 0 ? ' class="sel"' : '') + '><div class="rc">' + escH(e.chapter) + '</div><div class="rt">' +
        markUp(e.title, terms) + '</div>' + (snip ? '<div class="rs">' + markUp(snip, terms) + '</div>' : '') + '</a>';
    }).join('');
  };
  q.addEventListener('input', run);
  q.addEventListener('keydown', (e) => {
    const links = results.querySelectorAll('a');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!links.length) return;
      links[sel] && links[sel].classList.remove('sel');
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
      links[sel].classList.add('sel'); links[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && links[sel]) {
      e.preventDefault(); location.hash = links[sel].getAttribute('href'); q.blur(); setOpen(false);
    } else if (e.key === 'Escape') { q.value = ''; run(); q.blur(); }
  });
  results.addEventListener('click', (e) => { if (e.target.closest('a')) { q.value = ''; run(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== q && !e.metaKey && !e.ctrlKey) {
      e.preventDefault(); if (window.innerWidth <= 900) setOpen(true); q.focus();
    }
  });
})();
</script>
</body>
</html>
