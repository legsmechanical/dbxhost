<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dAVEBOx SA Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="description" content="The dAVEBOx SA user manual: an 8-track MIDI sequencer for Ableton Move.">
<style>
/* Generated by davebox/tools/build_manual_html.mjs from the manual draft — do not hand-edit.
 * Layout: each chapter is its own sheet on a grey ground; section numbers hang in the sheet's left
 * margin; tables are ruled grids; notes are boxed. One reading face (IBM Plex Sans), falling back to
 * the system font when the page is opened offline. */
:root {
  --ground: #e9ecf0;
  --sheet: #ffffff;
  --ink: #14171c;
  --ink-soft: #383d45;
  --muted: #5b626d;
  --rule: #d6dae1;
  --rule-strong: #b4bbc6;
  --head-bg: #e8ebf0;
  --col1-bg: #f5f6f8;
  --panel: #f3f4f7;
  --accent: #1f55c4;
  --code-bg: #eceef2;
  --key-bg: #ffffff;
  --note-bg: #edf2fd; --note-edge: #b9cbf2; --note-ink: #1f55c4;
  --warn-bg: #fff4e3; --warn-edge: #ecc27e; --warn-ink: #985200;
  --like-bg: #eaf6ef; --like-edge: #a6d6bb; --like-ink: #1b7146;
  --mark: #ffe98a;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side: 17rem;
  --gutter: 4.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e1013; --sheet: #181b20; --ink: #e9ebef; --ink-soft: #c6cbd3; --muted: #959daa;
    --rule: #2d323b; --rule-strong: #434a56; --head-bg: #232831; --col1-bg: #1d2127; --panel: #1f2329;
    --accent: #84a9ff; --code-bg: #252a32; --key-bg: #262b33;
    --note-bg: #17223a; --note-edge: #30477a; --note-ink: #9dbbff;
    --warn-bg: #2a1f10; --warn-edge: #634619; --warn-ink: #f3ac4d;
    --like-bg: #11261b; --like-edge: #255a3d; --like-ink: #66d39e;
    --mark: #5c4b0e;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1013; --sheet: #181b20; --ink: #e9ebef; --ink-soft: #c6cbd3; --muted: #959daa;
  --rule: #2d323b; --rule-strong: #434a56; --head-bg: #232831; --col1-bg: #1d2127; --panel: #1f2329;
  --accent: #84a9ff; --code-bg: #252a32; --key-bg: #262b33;
  --note-bg: #17223a; --note-edge: #30477a; --note-ink: #9dbbff;
  --warn-bg: #2a1f10; --warn-edge: #634619; --warn-ink: #f3ac4d;
  --like-bg: #11261b; --like-edge: #255a3d; --like-ink: #66d39e;
  --mark: #5c4b0e;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 1.5rem; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 1.0625rem/1.65 var(--f-body); }
a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── sidebar ── */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side);
  background: var(--sheet); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; z-index: 20; font-size: .9375rem;
}
.side a { text-decoration: none; }
.brand { padding: 1.1rem 1.25rem .6rem; }
.brand a { color: var(--ink); font-weight: 600; font-size: 1.0625rem; }
.brand .sub { color: var(--muted); font-weight: 400; }
.search { padding: .25rem 1rem .75rem; border-bottom: 1px solid var(--rule); }
.search input {
  width: 100%; font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--rule-strong); border-radius: 5px; padding: .4rem .6rem;
}
.search input::placeholder { color: var(--muted); }
.nav { overflow-y: auto; padding: .25rem .6rem 2rem; flex: 1; overscroll-behavior: contain; }
.part { margin-top: 1rem; }
.ptitle { font-weight: 600; color: var(--muted); padding: 0 .65rem .3rem; font-size: .8125rem; letter-spacing: .02em; }
.nav ol { list-style: none; margin: 0; padding: 0; }
.nav > .part > ol > li > a { display: flex; gap: .55rem; padding: .25rem .65rem; color: var(--ink-soft); line-height: 1.35; border-radius: 5px; }
.nav .n { color: var(--muted); min-width: 1.2rem; text-align: right; font-variant-numeric: tabular-nums; }
.nav a:hover { background: var(--panel); }
.nav li.active > a { color: var(--ink); background: var(--head-bg); font-weight: 600; }
.nav li.active > a .n { color: var(--accent); }
.nav .subs { display: none; margin: .2rem 0 .5rem 2.4rem; border-left: 1px solid var(--rule); }
.nav li.active > .subs { display: block; }
.nav .subs a { display: block; padding: .15rem .7rem; color: var(--muted); line-height: 1.35; font-size: .875rem; }
.nav .subs a.on { color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.results { display: none; padding: .25rem .6rem 2rem; overflow-y: auto; flex: 1; }
.results a { display: block; padding: .45rem .65rem; color: var(--ink); border-radius: 5px; }
.results a:hover, .results a.sel { background: var(--head-bg); }
.results .rt { font-weight: 600; line-height: 1.3; }
.results .rc { font-size: .75rem; color: var(--muted); }
.results .rs { font-size: .8125rem; color: var(--muted); line-height: 1.4; margin-top: .1rem; }
.results mark { background: var(--mark); color: inherit; }
.results .none { color: var(--muted); padding: .45rem .65rem; }
.side.searching .nav { display: none; }
.side.searching .results { display: block; }
.side-foot { padding: .6rem 1.25rem; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .8125rem; }
.theme-btn { font: inherit; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 4px; padding: .15rem .5rem; cursor: pointer; }
.theme-btn:hover { color: var(--ink); border-color: var(--rule-strong); }

/* ── mobile bar ── */
.topbar { display: none; }
@media (max-width: 960px) {
  .side { transform: translateX(-100%); transition: transform .2s ease; width: min(19rem, 86vw); }
  .side.open { transform: none; }
  .topbar {
    display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; align-items: center; gap: .9rem;
    padding: .55rem max(16px, env(safe-area-inset-right, 0px)) .55rem max(16px, env(safe-area-inset-left, 0px));
    background: var(--sheet); border-bottom: 1px solid var(--rule); font-weight: 600;
  }
  .topbar button { font: inherit; font-weight: 500; color: var(--ink); background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 5px; padding: .25rem .7rem; cursor: pointer; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 18; display: none; }
  .scrim.on { display: block; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* ── sheets ── */
main { margin-left: var(--side); padding-block: 2rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 960px) { main { margin-left: 0; padding-top: 1rem; } }
.col { max-width: 52rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
.sheet {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px;
  padding: 2.5rem 3rem 2.75rem var(--gutter); min-width: 0;
}
@media (max-width: 700px) { .sheet { padding: 1.5rem 1.1rem 1.75rem; --gutter: 1.1rem; } }

.hero h1 { font-size: 2.25rem; font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
.hero .ver { color: var(--muted); margin: .25rem 0 1.75rem; }
.intro h2 { font-size: 1.25rem; font-weight: 600; margin: 2.25rem 0 .6rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
.toc { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 1.25rem 2rem; margin: 2rem 0 0; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
.toc h3 { font-size: .875rem; font-weight: 600; color: var(--muted); margin: 0 0 .35rem; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li { margin: .15rem 0; display: flex; gap: .5rem; }
.toc .n { color: var(--muted); min-width: 1.3rem; text-align: right; font-variant-numeric: tabular-nums; }
.toc a { text-decoration: none; color: var(--ink); }
.toc a:hover { color: var(--accent); text-decoration: underline; }

/* chapter head: the number in a square, the title beside it */
.chhead { display: flex; align-items: center; gap: 1rem; margin: 0 0 1.5rem; }
.chnum {
  flex: none; width: 2.75rem; height: 2.75rem; display: grid; place-items: center;
  border: 1.5px solid var(--ink); border-radius: 6px; font-size: 1.375rem; font-weight: 600; font-variant-numeric: tabular-nums;
}
.chhead h1 { font-size: 2rem; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
@media (min-width: 701px) { .chhead { margin-left: calc(1.25rem - var(--gutter)); gap: calc(var(--gutter) - 4rem); } }

.chapter h2 {
  position: relative; font-size: 1.375rem; font-weight: 600; line-height: 1.3; text-wrap: balance;
  margin: 2.75rem 0 .75rem; padding-top: 1.5rem; border-top: 1px solid var(--rule);
}
.chapter h2 .secnum { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 600; margin-right: .5rem; }
@media (min-width: 701px) {
  /* the rule runs into the margin; the number sits there, level with the chapter's number box */
  .chapter h2 { margin-left: calc(1.25rem - var(--gutter)); padding-left: calc(var(--gutter) - 1.25rem); }
  .chapter h2 .secnum { position: absolute; left: 0; top: 1.5rem; margin: 0; }
}
.chapter h3 { font-size: 1.125rem; font-weight: 600; line-height: 1.35; margin: 2.25rem 0 .5rem; }
.chapter h4 { font-size: 1.0625rem; font-weight: 600; margin: 1.75rem 0 .4rem; }
p, ul, ol { margin: 0 0 1.1rem; }
ul, ol { padding-left: 1.5rem; }
li { margin: .3rem 0; }
li > ul, li > ol { margin: .3rem 0 .5rem; }
li::marker { color: var(--muted); }
strong { font-weight: 600; }
code { font: .875em var(--f-mono); background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }

/* hardware buttons */
kbd {
  font: 600 .8125em/1 var(--f-body); white-space: nowrap; color: var(--ink);
  background: var(--key-bg); border: 1px solid var(--rule-strong); border-bottom-width: 2px;
  border-radius: 4px; padding: .18em .45em .12em;
}
.kjoin { color: var(--muted); }

/* tables: a ruled grid, header row and first column shaded */
.tablewrap { overflow-x: auto; margin: 0 0 1.5rem; border: 1px solid var(--rule-strong); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .9688rem; line-height: 1.5; }
th, td { border: 1px solid var(--rule); padding: .55rem .8rem; text-align: left; vertical-align: top; }
th { background: var(--head-bg); font-weight: 600; border-bottom-color: var(--rule-strong); }
td:first-child { background: var(--col1-bg); font-weight: 500; }
tr > :first-child { border-left: 0; }
tr > :last-child { border-right: 0; }
thead tr > * { border-top: 0; }
tbody tr:last-child > * { border-bottom: 0; }
td:first-child:has(.keys) { white-space: nowrap; }
@media (max-width: 600px) { td:first-child:has(.keys) { white-space: normal; } th, td { padding: .5rem .6rem; } }

/* notes: boxed, the kind named at the top */
.callout { margin: 1.5rem 0; padding: .85rem 1.1rem .9rem; border: 1px solid var(--note-edge); border-radius: 6px; background: var(--note-bg); }
.callout .clabel { font-weight: 600; font-size: .9375rem; color: var(--note-ink); margin-bottom: .25rem; }
.callout.warn { background: var(--warn-bg); border-color: var(--warn-edge); }
.callout.warn .clabel { color: var(--warn-ink); }
.callout.likemove { background: var(--like-bg); border-color: var(--like-edge); }
.callout.likemove .clabel { color: var(--like-ink); }
.callout > :last-child, .callout > :last-child > :last-child { margin-bottom: 0; }
p.video { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem; font-size: .9375rem; margin: 0 0 1.1rem; }
p.video .vtag { flex: none; font-size: .8125rem; font-weight: 600; color: var(--muted); border: 1px solid var(--rule-strong); border-radius: 4px; padding: .05rem .45rem; }

pre.diagram {
  font: .8125rem/1.45 var(--f-mono); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: .85rem 1rem; overflow-x: auto; margin: 0 0 1.5rem;
}

/* screens sit in a panel, captions under each */
.figs { display: grid; grid-template-columns: 1fr; gap: 1.25rem; margin: 1.5rem 0; padding: 1.1rem; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
.figs.multi { grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
figure { margin: 0; min-width: 0; }
.bezel { background: #000; border-radius: 4px; padding: 8px; max-width: 22rem; }
.figs.multi .bezel { max-width: none; }
.bezel img { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 2 / 1; image-rendering: pixelated; image-rendering: crisp-edges; }
figure.diagram { color: var(--ink); }
figure.diagram svg { display: block; width: 100%; height: auto; }
figure.shot img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 4px; }
figcaption { font-size: .875rem; line-height: 1.5; color: var(--ink-soft); margin-top: .55rem; }
.ftitle { font-weight: 600; color: var(--ink); }

details.fold { margin: 0 0 1.1rem; border: 1px solid var(--rule-strong); border-radius: 6px; padding: 0 1rem; }
details.fold > summary { cursor: pointer; padding: .6rem 0; font-weight: 600; }
details.fold[open] > summary { border-bottom: 1px solid var(--rule); margin-bottom: .75rem; }

.colophon { font-size: .8125rem; color: var(--muted); text-align: center; margin: 0; }

@media print {
  body { background: #fff; }
  .side, .topbar, .scrim { display: none !important; }
  main { margin: 0; padding: 0; }
  .sheet { border: 0; padding: 0 0 0 var(--gutter); }
  .chapter { break-before: page; }
}
</style>
</head>
<body>

<div class="topbar">
  <button type="button" id="menuBtn" aria-controls="side" aria-expanded="false">Contents</button>
  <span>dAVEBOx SA Manual</span>
</div>
<div class="scrim" id="scrim"></div>

<aside class="side" id="side">
  <div class="brand"><a href="#top">dAVEBOx SA <span class="sub">Manual</span></a></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search  ( / )" autocomplete="off" aria-label="Search the manual">
  </div>
  <nav class="nav" id="nav">{{NAV}}</nav>
  <div class="results" id="results" role="listbox"></div>
  <div class="side-foot"><span>Version {{VERSION}}</span><button class="theme-btn" id="themeBtn" type="button">Theme</button></div>
</aside>

<main id="top">
  <div class="col">
    <header class="hero sheet">
      <h1>dAVEBOx SA</h1>
      <p class="ver">User manual · version {{VERSION}}</p>
      <div class="intro">{{INTRO}}</div>
      <nav class="toc" aria-label="Contents">{{TOC}}</nav>
    </header>
    {{CHAPTERS}}
    <p class="colophon">Every screen in this manual is drawn by dAVEBOx's own display code, rendered off the device. Generated from the manual source; {{SCREENCOUNT}} screens.</p>
  </div>
</main>
<script>
(() => {
  const side = document.getElementById('side');
  const nav = document.getElementById('nav');
  const q = document.getElementById('q');
  const results = document.getElementById('results');
  const menuBtn = document.getElementById('menuBtn');
  const scrim = document.getElementById('scrim');

  /* mobile drawer */
  const setOpen = (on) => { side.classList.toggle('open', on); scrim.classList.toggle('on', on); menuBtn.setAttribute('aria-expanded', on); };
  menuBtn.addEventListener('click', () => setOpen(!side.classList.contains('open')));
  scrim.addEventListener('click', () => setOpen(false));
  side.addEventListener('click', (e) => { if (e.target.closest('a')) setOpen(false); });

  /* theme: system → light → dark */
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const themes = [null, 'light', 'dark'];
  let ti = 0;
  try { const t = localStorage.getItem('dbx-manual-theme'); if (t) { ti = themes.indexOf(t); root.dataset.theme = t; } } catch (e) {}
  const label = () => { themeBtn.textContent = 'Theme: ' + (themes[ti] || 'auto'); };
  label();
  themeBtn.addEventListener('click', () => {
    ti = (ti + 1) % themes.length;
    if (themes[ti]) root.dataset.theme = themes[ti]; else delete root.dataset.theme;
    try { themes[ti] ? localStorage.setItem('dbx-manual-theme', themes[ti]) : localStorage.removeItem('dbx-manual-theme'); } catch (e) {}
    label();
  });

  /* scrollspy: the chapter in view opens its section list; the section in view is marked */
  const chapterEls = [...document.querySelectorAll('section.chapter')];
  const secEls = [...document.querySelectorAll('section.chapter h2[id]')];
  const navLi = new Map([...nav.querySelectorAll('li[data-ch]')].map((li) => [li.dataset.ch, li]));
  const subA = new Map([...nav.querySelectorAll('.subs a')].map((a) => [a.getAttribute('href').slice(1), a]));
  let curCh = null, curSec = null;
  const spy = () => {
    const y = window.innerHeight * 0.25;
    let ch = null; for (const c of chapterEls) { if (c.getBoundingClientRect().top <= y) ch = c; else break; }
    let sec = null; if (ch) for (const h of ch.querySelectorAll('h2[id]')) { if (h.getBoundingClientRect().top <= y) sec = h; else break; }
    const chId = ch && ch.id, secId = sec && sec.id;
    if (chId !== curCh) {
      if (curCh && navLi.get(curCh)) navLi.get(curCh).classList.remove('active');
      if (chId && navLi.get(chId)) {
        const li = navLi.get(chId); li.classList.add('active');
        const r = li.getBoundingClientRect(), nr = nav.getBoundingClientRect();
        if (r.top < nr.top || r.top > nr.bottom - 80) nav.scrollTop += r.top - nr.top - 40;
      }
      curCh = chId;
    }
    if (secId !== curSec) {
      if (curSec && subA.get(curSec)) subA.get(curSec).classList.remove('on');
      if (secId && subA.get(secId)) subA.get(secId).classList.add('on');
      curSec = secId;
    }
  };
  let raf = 0;
  window.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; spy(); }); }, { passive: true });
  spy();

  /* search: every h2/h3 with the text beneath it, ranked by where the words hit */
  const index = [];
  for (const ch of chapterEls) {
    const chTitle = ch.dataset.title;
    const chNum = ch.dataset.num;
    const numbered = /^\d+$/.test(chNum);
    let cur = { id: ch.id, title: chTitle, chapter: numbered ? 'Chapter ' + chNum : 'Walkthrough', text: '' };
    index.push(cur);
    for (const el of ch.children) {
      if (/^H[23]$/.test(el.tagName) && el.id) {
        cur = { id: el.id, title: el.textContent, chapter: (numbered ? chNum + '. ' : '') + chTitle, text: '' };
        index.push(cur);
      } else {
        cur.text += ' ' + el.textContent;
      }
    }
  }
  index.forEach((e) => { e.text = e.text.replace(/\s+/g, ' ').trim(); e.lt = e.title.toLowerCase(); e.lx = e.text.toLowerCase(); });
  const escH = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const markUp = (s, terms) => { let h = escH(s); for (const t of terms) h = h.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); return h; };
  let hits = [], sel = 0;
  const run = () => {
    const raw = q.value.trim().toLowerCase();
    side.classList.toggle('searching', !!raw);
    if (!raw) { results.innerHTML = ''; return; }
    const terms = raw.split(/\s+/).filter(Boolean);
    hits = index.map((e) => {
      let score = 0;
      for (const t of terms) {
        const inT = e.lt.includes(t), inX = e.lx.includes(t);
        if (!inT && !inX) return null;
        score += inT ? 10 : 0; score += inX ? Math.min(5, e.lx.split(t).length - 1) : 0;
      }
      return { e, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 30);
    sel = 0;
    if (!hits.length) { results.innerHTML = '<div class="none">No sections match “' + escH(raw) + '”.</div>'; return; }
    results.innerHTML = hits.map(({ e }, i) => {
      const p = e.lx.indexOf(terms[0]);
      const snip = p >= 0 ? (p > 40 ? '…' : '') + e.text.slice(Math.max(0, p - 40), p + 90) + '…' : '';
      return '<a href="#' + e.id + '"' + (i === 0 ? ' class="sel"' : '') + '><div class="rc">' + escH(e.chapter) + '</div><div class="rt">' +
        markUp(e.title, terms) + '</div>' + (snip ? '<div class="rs">' + markUp(snip, terms) + '</div>' : '') + '</a>';
    }).join('');
  };
  q.addEventListener('input', run);
  q.addEventListener('keydown', (e) => {
    const links = results.querySelectorAll('a');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!links.length) return;
      links[sel] && links[sel].classList.remove('sel');
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
      links[sel].classList.add('sel'); links[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && links[sel]) {
      e.preventDefault(); location.hash = links[sel].getAttribute('href'); q.blur(); setOpen(false);
    } else if (e.key === 'Escape') { q.value = ''; run(); q.blur(); }
  });
  results.addEventListener('click', (e) => { if (e.target.closest('a')) { q.value = ''; run(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== q && !e.metaKey && !e.ctrlKey) {
      e.preventDefault(); if (window.innerWidth <= 900) setOpen(true); q.focus();
    }
  });
})();
</script>
</body>
</html>
