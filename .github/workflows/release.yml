name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ davebox-sa
  # The CATALOG tarball for the launcher module (2026-09-05, the zero-SSH
  # install): one archive carrying the whole SA deliverable — the dbx-host host
  # build, the heal helper (unblessed), the chain host and the davebox sequencer
  # module — laid out by standalone/scripts/build-sa-release.sh so the first
  # launch from stock's Tools menu installs it with no SSH. release.json at the
  # repo root points the manager at this asset; keep its version == module.json.
  davebox-sa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: davebox/package-lock.json }
      - name: Version from tag
        run: |
          # The tag is dAVEBOx's release version. It is NOT the host's:
          # src/host/version.txt is the Schwung BASE version the host tracks,
          # and modules' min_host_version is checked against it (store_utils,
          # schwung-manager) -- a 0.0.1 there refuses every module that asks
          # for 1.5.0. So the tag is checked, never written into it.
          VERSION="${GITHUB_REF_NAME#v}"
          MJ="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' standalone/module/module.json | head -1)"
          RJ="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' release.json | head -1)"
          echo "tag $VERSION · module.json $MJ · release.json $RJ · host base $(cat src/host/version.txt)"
          [ "$MJ" = "$RJ" ] || { echo "module.json and release.json disagree"; exit 1; }
          [ "$RJ" = "$VERSION" ] || { echo "the tag does not match release.json"; exit 1; }
      - name: Build schwung-manager (Go, for the dbx-host tree)
        run: |
          mkdir -p build
          cd schwung-manager
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o ../build/schwung-manager -ldflags="-s -w" .
      - name: Build the dbx-host host (docker, DBX SHM prefix)
        run: ./standalone/scripts/build-host.sh
      - name: Build the heal helper
        run: ./standalone/scripts/build-heal.sh
      - name: Build the davebox module
        run: |
          cd davebox && npm ci --no-audit --no-fund && bash scripts/build_sound.sh
      - name: Build the HTML manual
        run: |
          bash davebox/scripts/build_manual_html.sh "$PWD/dAVEBOx-SA-manual.html"
          ls -la dAVEBOx-SA-manual.html
      - name: Assemble the catalog tarball
        env:
          # Test builds (0.0.x) carry the "Report a bug" upload address.
          SA_BUG_REPORT_URL: ${{ secrets.SA_BUG_REPORT_URL }}
          SA_BUG_REPORT_TOKEN: ${{ secrets.SA_BUG_REPORT_TOKEN }}
        run: |
          # The manual rides inside as the manager's Help page, too.
          MANUAL_HTML="$PWD/dAVEBOx-SA-manual.html" ./standalone/scripts/build-sa-release.sh .
          tar -tzf davebox-sa-module.tar.gz | grep -x 'davebox-sa/payload/help/manual.html'
          tar -tzf davebox-sa-module.tar.gz | grep -c . 
          tar -tzf davebox-sa-module.tar.gz | grep -x 'davebox-sa/payload/bin/heal'
          tar -tzf davebox-sa-module.tar.gz | grep -x 'davebox-sa/payload/scripts/bootstrap.sh'
          ls -la davebox-sa-module.tar.gz
      - name: Assemble the uninstaller tarball (release asset only, never the catalog)
        run: |
          ./standalone/scripts/build-uninstall-release.sh .
          tar -tzf davebox-uninstall-module.tar.gz | grep -x 'davebox-uninstall/bin/heal.new'
          tar -tzf davebox-uninstall-module.tar.gz | grep -x 'davebox-uninstall/uninstall.sh'
      - name: Attach to the release
        uses: softprops/action-gh-release@v1
        with:
          # 0.0.x is a TEST build (Josh, 2026-09-28): a GitHub pre-release,
          # never the repo's "latest", and not in the Schwung catalog.
          prerelease: ${{ startsWith(github.ref_name, 'v0.0.') || contains(github.ref_name, '-') }}
          files: |
            davebox-sa-module.tar.gz
            davebox-uninstall-module.tar.gz
            dAVEBOx-SA-manual.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
